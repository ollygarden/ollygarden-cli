name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# go.olly.garden modules resolve to private repositories: GOPRIVATE skips the
# public proxy and checksum database, and the git insteadOf rewrite injects
# the org token. Fork PRs don't receive secrets, so their runs fail at module
# download — accepted trade-off of the private dependency.
env:
  GOPRIVATE: go.olly.garden/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup access for private go modules
        run: |
          git config --global url."https://git:${{ secrets.GO_GITHUB_TOKEN }}@github.com".insteadOf "https://github.com"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup access for private go modules
        run: |
          git config --global url."https://git:${{ secrets.GO_GITHUB_TOKEN }}@github.com".insteadOf "https://github.com"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup access for private go modules
        run: |
          git config --global url."https://git:${{ secrets.GO_GITHUB_TOKEN }}@github.com".insteadOf "https://github.com"

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Verify release and Homebrew artifacts
        run: .github/scripts/verify-release-artifacts.sh
