name: windows-cli

on:
  push:
    branches:
      - test/windows-cli-install
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test on Windows
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and install from ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.0.0-windows-ci'
          $packageDir = Join-Path $env:RUNNER_TEMP 'ollygarden-package'
          $archivePath = Join-Path $env:RUNNER_TEMP 'ollygarden_0.0.0-windows_amd64.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'ollygarden-bin'

          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item README.md, LICENSE, NOTICE -Destination $packageDir

          $ldflags = "-s -w -X main.version=$version -X main.commit=$env:GITHUB_SHA -X main.date=windows-ci"
          go build -trimpath -ldflags $ldflags -o (Join-Path $packageDir 'ollygarden.exe') ./cmd/ollygarden
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir

          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          $installDir >> $env:GITHUB_PATH

      - name: Smoke-test installed CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedExecutable = Join-Path $env:INSTALL_DIR 'ollygarden.exe'
          $installedExecutable = (Get-Command ollygarden -ErrorAction Stop).Source
          if ($installedExecutable -ne $expectedExecutable) {
            throw "Expected $expectedExecutable on PATH, found $installedExecutable"
          }

          $buildInfo = ollygarden version --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($buildInfo.version -ne '0.0.0-windows-ci') {
            throw "Unexpected version: $($buildInfo.version)"
          }
          if ($buildInfo.os -ne 'windows' -or $buildInfo.arch -ne 'amd64') {
            throw "Unexpected platform: $($buildInfo.os)/$($buildInfo.arch)"
          }

          $help = ollygarden --help | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($help -notmatch 'CLI client for the OllyGarden REST API') {
            throw 'Installed CLI did not return the expected help text'
          }
