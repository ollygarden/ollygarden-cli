name: windows-cli

on:
  push:
    branches:
      - test/windows-cli-install
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and verify released CLI
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OLLYGARDEN_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'ollygarden-bin'
          $installer = Get-Content .\install.ps1 -Raw

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $installer,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "PowerShell parse errors: $($parseErrors -join '; ')"
          }

          Invoke-Expression $installer
          $expectedExecutable = Join-Path $env:OLLYGARDEN_INSTALL_DIR 'ollygarden.exe'
          $installedExecutable = (Get-Command ollygarden -ErrorAction Stop).Source
          if ($installedExecutable -ne $expectedExecutable) {
            throw "Expected $expectedExecutable on PATH, found $installedExecutable"
          }

          $buildInfo = ollygarden version --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($buildInfo.os -ne 'windows' -or $buildInfo.arch -ne 'amd64') {
            throw "Unexpected platform: $($buildInfo.os)/$($buildInfo.arch)"
          }

          Invoke-Expression $installer
          $pathMatches = @(
            [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' |
              Where-Object { $_.TrimEnd('\') -ieq $env:OLLYGARDEN_INSTALL_DIR.TrimEnd('\') }
          )
          if ($pathMatches.Count -ne 1) {
            throw "Expected one user Path entry, found $($pathMatches.Count)"
          }
